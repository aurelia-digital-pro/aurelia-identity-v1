<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AURELIA Identity Generator - MVP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="left">Generator v2.0</div>
    <div class="right">ID <strong>AURELIA</strong></div>
  </header>

  <main class="container">
    <button id="startBtn" class="primary">أنشئ هويتك الآن</button>

    <h1>AURELIA Identity Generator</h1>
    <p class="subtitle">أدخل بياناتك وستحصل على رابط هوية رقمية جاهز للمشاركة فوراً</p>

    <section class="card">
      <h2>الهوية الشخصية <span class="badge">01</span></h2>

      <label class="upload-box" for="profileInput" id="profileBox">
        <input id="profileInput" type="file" accept="image/*" />
        <div class="upload-inner">
          <div class="camera">📷</div>
          <div>اضغط لرفع صورتك</div>
          <small>JPG / PNG — حتى 2MB</small>
        </div>
      </label>

      <div class="field">
        <label>الاسم الكامل *</label>
        <input id="fullName" placeholder="مثال: أحمد محمد علي" />
      </div>

      <div class="field">
        <label>اسم المتجر / العرض</label>
        <input id="storeName" placeholder="مثال: متجر أحمد" />
      </div>

      <div class="actions-row">
        <button id="saveProfile" class="primary">حفظ الهوية</button>
        <button id="clearProfile" class="muted">مسح</button>
      </div>
    </section>

    <section class="card">
      <h2>المنتجات</h2>

      <div class="field">
        <label>أضف منتجاً جديداً</label>
        <input id="productTitle" placeholder="عنوان المنتج" />
        <textarea id="productDesc" placeholder="وصف قصير"></textarea>
        <input id="productPrice" placeholder="السعر" type="number" />
        <input id="productImage" type="file" accept="image/*" />
        <div class="actions-row">
          <button id="addProduct" class="primary">أضِف المنتج</button>
          <button id="clearProducts" class="muted">مسح الكل</button>
        </div>
      </div>

      <div id="productsList" class="products-list"></div>

      <div class="actions-row">
        <button id="exportBtn" class="primary">تنزيل بيانات (.json)</button>
        <input id="importFile" type="file" accept="application/json" style="display:none" />
        <button id="importBtn" class="muted">استعادة بيانات (.json)</button>
      </div>
    </section>

  </main>

  <footer class="browser-bar">aurelia-digital-pro.github.io</footer>

  <script src="script.js"></script>
</body>
</html>
